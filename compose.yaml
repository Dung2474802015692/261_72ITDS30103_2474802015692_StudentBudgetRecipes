# One command for the full local stack: docker compose up --build
# Starts PostgreSQL and the app; the app waits until the database is healthy.
name: student-budget-recipes

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Optional local .env (for GEMINI_API_KEY). Compose works without it.
    env_file:
      - path: .env
        required: false
    environment:
      # Always the Compose database, even if .env holds a different DATABASE_URL.
      DATABASE_URL: postgresql://budget:budget@db:5432/budget
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
