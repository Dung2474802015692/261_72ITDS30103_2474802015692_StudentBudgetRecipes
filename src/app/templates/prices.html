{% extends "base.html" %}
{% block body %}
<h1>Bảng giá siêu thị</h1>
<p class="warn">Đây là <strong>giá mẫu</strong> nhập tay, không phải giá thật của siêu thị. Sửa giá ở đây, thực đơn sẽ tính lại ngay.</p>

<section class="card">
  <h2>Thêm sản phẩm</h2>
  <form method="post" action="/prices">
    <label>Tên <input name="name" required></label>
    <label>Đơn vị (kg, quả, gói…) <input name="unit" required size="8"></label>
    <label>Giá mỗi đơn vị (đ) <input type="text" inputmode="numeric" autocomplete="off" data-money name="price" required></label>
    <label>Nhóm <input name="category"></label>
    <button>Thêm</button>
  </form>
</section>

<div class="table-wrap">
<table>
  <tr><th>Nhóm</th><th>Sản phẩm</th><th>Đơn vị</th><th class="num">Giá (đ)</th><th></th></tr>
  {% for item in items %}
  <tr>
    <td>{{ item.category }}</td>
    <td>{{ item.name }}</td>
    <td><input form="edit{{ item.id }}" name="unit" value="{{ item.unit }}" size="6" aria-label="Đơn vị {{ item.name }}"></td>
    <td><input form="edit{{ item.id }}" type="text" inputmode="numeric" autocomplete="off" data-money name="price" value="{{ item.price }}" aria-label="Giá {{ item.name }}"></td>
    <td>
      <form id="edit{{ item.id }}" class="inline" method="post" action="/prices/{{ item.id }}"><button>Lưu</button></form>
      <form class="inline" method="post" action="/prices/{{ item.id }}/delete"><button class="danger">Xoá</button></form>
    </td>
  </tr>
  {% endfor %}
</table>
</div>
{% endblock %}
